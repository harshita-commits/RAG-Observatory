[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-observatory"
version = "0.2.0"
description = "Local RAG experiments, framework-independent evaluation and LLM telemetry"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rag-observatory = "observatory.__main__:main"

[tool.setuptools.packages.find]
include = ["observatory*"]

[tool.setuptools.package-data]
observatory = ["static/*"]
