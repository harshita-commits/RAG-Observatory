name: rag-observatory
services:
  ollama:
    # Verified Ollama 0.40.7; pin the downloaded multi-platform image digest.
    image: ollama/ollama@sha256:2e6cc92ffa43b4b1a2e70e315407e00ac97ec125afc71277d73c7efe01c4f31b
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  mlflow:
    image: rag-observatory:local
    build: .
    environment:
      MLFLOW_ENABLE_TELEMETRY: "false"
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--backend-store-uri", "sqlite:////app/artifacts/mlflow.db", "--artifacts-destination", "/app/artifacts/mlartifacts", "--allowed-hosts", "mlflow:5000,localhost:5000,127.0.0.1:5000"]
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  dashboard:
    image: rag-observatory:local
    build: .
    environment:
      OBSERVATORY_BIND_HOST: "0.0.0.0"
      LLM_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://ollama:11434"
      GENERATOR_MODEL: ${GENERATOR_MODEL:-llama3.2:3b}
      JUDGE_MODEL: ${JUDGE_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-600}
      OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-4}
      RAGAS_DO_NOT_TRACK: "true"
      HF_HUB_OFFLINE: "1"
      MLFLOW_ENABLE_TELEMETRY: "false"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - observatory-data:/app/artifacts
    depends_on:
      ollama:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/session', timeout=8)"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  ollama-models:
  observatory-data:
  mlflow-data:
